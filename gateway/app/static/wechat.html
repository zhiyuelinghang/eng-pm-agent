<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>微信群消息 · 工程管理智能体</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  :root { --bg:#f4f6fb; --card:#fff; --line:#e7eaf3; --txt:#1f2430; --muted:#8a93a6;
    --brand:#5b6cff; --ok:#16b364; --shadow:0 4px 18px rgba(31,36,48,.06); }
  body { font-family:-apple-system,"Segoe UI",Roboto,"Microsoft YaHei",sans-serif;
    background:var(--bg); color:var(--txt); line-height:1.5; height:100vh; display:flex; flex-direction:column; }
  .topbar { background:#fff; height:64px; padding:0 30px; display:flex; align-items:center;
    justify-content:space-between; border-bottom:1px solid var(--line); flex-shrink:0; }
  .topbar h1 { margin:0; font-size:18px; font-weight:700; }
  .topbar .crumb { font-size:12.5px; color:var(--muted); margin-top:3px; }
  .topbar .meta { font-size:13px; color:var(--muted); }
  .layout { flex:1; display:flex; min-height:0; }
  /* 左侧群列表 */
  .groups { width:280px; background:var(--card); border-right:1px solid var(--line);
    overflow-y:auto; flex-shrink:0; }
  .group { padding:14px 18px; border-bottom:1px solid var(--line); cursor:pointer; transition:.12s; }
  .group:hover { background:#f7f8fe; }
  .group.active { background:#eef0ff; border-left:3px solid var(--brand); padding-left:15px; }
  .group .gname { font-size:14px; font-weight:600; margin-bottom:4px; }
  .group .gmeta { font-size:12px; color:var(--muted); display:flex; gap:10px; flex-wrap:wrap; }
  /* 右侧消息区 */
  .msgwrap { flex:1; display:flex; flex-direction:column; min-width:0; }
  .msghead { padding:14px 24px; border-bottom:1px solid var(--line); background:#fff;
    display:flex; align-items:center; justify-content:space-between; flex-shrink:0; }
  .msghead .t { font-size:15px; font-weight:700; }
  .msghead select { padding:7px 12px; font-size:13px; border:1.5px solid var(--line);
    border-radius:9px; background:#fafbfe; }
  .msgs { flex:1; overflow-y:auto; padding:20px 24px; }
  .msg { margin-bottom:16px; max-width:70%; }
  .msg.me { margin-left:auto; text-align:right; }
  .msg .who { font-size:12px; color:var(--muted); margin-bottom:4px; }
  .msg .bubble { display:inline-block; text-align:left; padding:9px 13px; border-radius:12px;
    background:#fff; border:1px solid var(--line); font-size:14px; word-break:break-word; box-shadow:var(--shadow); }
  .msg.me .bubble { background:#d5e3ff; border-color:#bcd1ff; }
  .msg .bubble.media { color:var(--muted); font-style:italic; }
  .msg .time { font-size:11px; color:var(--muted); margin-top:3px; }
  .empty { color:var(--muted); font-size:14px; padding:50px; text-align:center; margin:auto; }
  .badge { font-size:11px; padding:1px 8px; border-radius:20px; background:#eef0ff; color:var(--brand); }
</style>
</head>
<body>
  <div class="topbar">
    <div>
      <h1>微信群消息</h1>
      <div class="crumb">WeFlow 定时采集 · 工程项目沟通群</div>
    </div>
    <div class="meta" id="topMeta">加载中…</div>
  </div>
  <div class="layout">
    <div class="groups" id="groups"></div>
    <div class="msgwrap">
      <div class="msghead">
        <div class="t" id="curGroup">请选择群</div>
        <select id="dateSel" onchange="onDateChange()" style="display:none"></select>
      </div>
      <div class="msgs" id="msgs"><div class="empty">← 从左侧选择一个群查看消息</div></div>
    </div>
  </div>

<script>
const esc = s => String(s ?? "").replace(/[&<>]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));
async function api(p){ const r=await fetch(p); if(!r.ok) throw new Error(await r.text()); return r.json(); }
let groups = [], curFolder = null;

async function loadGroups(){
  try { groups = await api("/hermes/wechat/groups"); } catch(e){ groups=[]; }
  document.getElementById("topMeta").textContent = `共 ${groups.length} 个群`;
  if(!groups.length){
    document.getElementById("groups").innerHTML = `<div class="empty">暂无采集数据</div>`;
    return;
  }
  document.getElementById("groups").innerHTML = groups.map((g,i)=>`
    <div class="group" data-folder="${esc(g.folder)}" onclick="selectGroup('${esc(g.folder)}')">
      <div class="gname">${esc(g.name)}</div>
      <div class="gmeta">
        <span>👥 ${g.members} 人</span>
        <span>📅 ${g.last_date||"—"}</span>
        ${g.last_count?`<span class="badge">${g.last_count} 条</span>`:""}
      </div>
    </div>`).join("");
  // 默认选最近有消息的群
  const first = groups.find(g=>g.last_count>0) || groups[0];
  if(first) selectGroup(first.folder);
}

async function selectGroup(folder, date){
  curFolder = folder;
  document.querySelectorAll(".group").forEach(el=>
    el.classList.toggle("active", el.dataset.folder===folder));
  const g = groups.find(x=>x.folder===folder);
  document.getElementById("curGroup").textContent = g ? g.name : folder;
  document.getElementById("msgs").innerHTML = `<div class="empty">加载中…</div>`;
  let data;
  try {
    const q = "/hermes/wechat/messages?folder="+encodeURIComponent(folder)+(date?("&date="+date):"");
    data = await api(q);
  } catch(e){ document.getElementById("msgs").innerHTML=`<div class="empty">加载失败：${esc(e.message)}</div>`; return; }

  // 日期选择器
  const sel = document.getElementById("dateSel");
  if(data.dates && data.dates.length){
    sel.style.display = "";
    sel.innerHTML = data.dates.map(d=>`<option value="${d}" ${d===data.date?"selected":""}>${d}</option>`).join("");
  } else { sel.style.display="none"; }

  renderMessages(data.messages);
}

function onDateChange(){
  selectGroup(curFolder, document.getElementById("dateSel").value);
}

function renderMessages(msgs){
  const box = document.getElementById("msgs");
  if(!msgs || !msgs.length){ box.innerHTML = `<div class="empty">这一天没有消息</div>`; return; }
  box.innerHTML = msgs.map(m=>{
    const me = m.is_send===1;
    const media = m.has_media;
    return `<div class="msg ${me?'me':''}">
      <div class="who">${esc(m.sender||"")}</div>
      <div class="bubble ${media?'media':''}">${esc(m.content||"")}</div>
      <div class="time">${esc((m.time||"").slice(11))}</div>
    </div>`;
  }).join("");
  box.scrollTop = 0;
}

loadGroups();
</script>
</body>
</html>
