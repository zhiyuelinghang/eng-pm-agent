<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dobby 对话展示检查</title>
  <style>
    * { box-sizing: border-box; } body { margin: 0; background: #fbfcfb; color: #203e37; font: 14px/1.6 system-ui, 'Microsoft YaHei', sans-serif; }
    main { max-width: 860px; margin: 32px auto; padding: 0 20px; } h1 { font-size: 20px; } h2 { margin: 28px 0 10px; font-size: 14px; font-weight: 600; color: #61766e; }
    .bubble { background: #f2f6f4; border-radius: 10px; padding: 18px 20px; }.check-note { font-size: 12px; color: #657b71; }
    #confirmation-output { white-space: pre-wrap; font-size: 12px; overflow-wrap: anywhere; } button { font-size: 12px; }
    @media (max-width: 480px) { main { padding: 0 12px; margin: 20px auto; }.bubble { padding: 12px; } }
  </style>
</head>
<body><div id="app"></div><script type="module">
  import { createApp, h, ref } from 'vue'
  import coldMemoryHistory from './cold-memory-history.json'
  import AgentMessageContent from '../../src/components/agent/AgentMessageContent.vue'
  import { collaborationTrace, confirmationTrace, greetingTrace, message, runtimeHint, toolCall, trace } from './agentConversation.mjs'
  createApp({ setup() {
    const pending = ref(confirmationTrace())
    const busy = ref(false)
    const output = ref('尚未确认')
    function confirm(replyId, call, confirmed) {
      output.value = JSON.stringify({ replyId, toolCallId: call.id, revision: call.confirmation_revision, confirmed })
      busy.value = true
      // Local fixture only: no API, model call, or business write.
      setTimeout(() => { pending.value.status = 'interrupted'; busy.value = false }, 600)
    }
    const example = (id, title, run, props = {}) => [h('h2', title), h('section', { class: 'bubble', id }, [
      h(AgentMessageContent, { runtimeTrace: run, ...props }),
    ])]
    return () => h('main', [h('h1', 'Dobby 对话展示检查'), h('p', { class: 'check-note' }, '本地模拟记录，确认按钮不会执行实际业务。'),
      ...example('memory-history', '冷启动后直接读取的记忆历史', trace(coldMemoryHistory.messages)),
      ...example('greeting', '普通问候', greetingTrace()),
      ...example('working', '正在整理项目：思考与每条工作记录均保留', trace([{...message('lookup', [
        {type:'thinking',id:'reason',thinking:'先核对项目人员，再查看任务进展。'},
        toolCall('people','dobby_list_project_personnel',{project_id:'private-project'},'pending'),
        toolCall('tasks','dobby_list_project_tasks',{project_id:'private-project'},'pending'),
      ]),finished_at:null}], {status:'running',turnFinishedAt:null})),
      ...example('workflow', '整理完成：保留过程和结果', collaborationTrace()),
      ...example('confirmation', '协同操作等待确认', pending.value, { confirmationBusy: busy.value, onConfirm: confirm }),
      h('output', { id: 'confirmation-output' }, output.value),
      ...example('spectator', '其他成员查看同一操作', confirmationTrace(), { canConfirm: false }),
      ...example('starting', '尚无工具调用', trace([message('pending', [runtimeHint])], { status: 'running', turnFinishedAt: null })),
    ])
  } }).mount('#app')
</script></body></html>
