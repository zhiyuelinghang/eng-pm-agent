	server {
        listen       443 ssl;
        server_name  admin.stec-mc.com;

        #ssl                  on;
        ssl_certificate      E:/cert/admin.stec-mc.com_nginx/admin.stec-mc.com.pem;
        ssl_certificate_key  E:/cert/admin.stec-mc.com_nginx/admin.stec-mc.com.key;

        ssl_session_timeout  5m;

        ssl_protocols  SSLv2 SSLv3 TLSv1 TLSv1.1 TLSv1.2;
        ssl_ciphers  ALL:!ADH:!EXPORT56:RC4+RSA:+HIGH:+MEDIUM:+LOW:+SSLv2:+EXP;
        ssl_prefer_server_ciphers   on;
		
		location / {
			  proxy_pass http://admin.stec-mc.com/;
		}
    }
	
