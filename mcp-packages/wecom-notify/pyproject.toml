[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "wecom-notify"
version = "0.2.0"
description = "企业微信群机器人通知 MCP：文本、Markdown、图片、图文与成员提醒"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "httpx>=0.27,<1.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/wecom_notify"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"

