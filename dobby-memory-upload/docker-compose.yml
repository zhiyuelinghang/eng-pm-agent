# Docker Compose — Dobby Memory Demo 统一部署
#
# 启动核心服务:
#   docker compose up -d
#
# 启动 + Neo4j (Graphiti):
#   docker compose --profile neo4j up -d
#
# 启动 + WeKnora:
#   docker compose --profile weknora up -d
#
# 启动全部:
#   docker compose --profile neo4j --profile weknora up -d
#
# 访问:
#   Web 聊天界面: http://localhost:7860
#   Neo4j Browser: http://localhost:7474
#   WeKnora API:   http://localhost:8080

services:
  # ============================================================
  # PostgreSQL 16 + pgvector — 核心数据库
  # ============================================================
  postgres:
    image: pgvector/pgvector:pg16
    container_name: dobby-postgres
    environment:
      POSTGRES_DB: dobby_demo
      POSTGRES_USER: dobby
      POSTGRES_PASSWORD: dobby
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
      - ./init-db.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dobby -d dobby_demo"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - dobby-net

  # ============================================================
  # Neo4j 5 Community — Graphiti 时序图 (profile: neo4j)
  # ============================================================
  neo4j:
    image: neo4j:5-community
    container_name: dobby-neo4j
    profiles: ["neo4j"]
    environment:
      NEO4J_AUTH: neo4j/password
      NEO4J_PLUGINS: '["apoc"]'
    ports:
      - "7474:7474"
      - "7687:7687"
    volumes:
      - neo4j_data:/data
    restart: unless-stopped
    networks:
      - dobby-net

  # ============================================================
  # WeKnora 知识库 (profile: weknora)
  # 需要先配置 weknora/ 目录下的 docker-compose（weknora/ 不在本仓库，从官方获取）
  # ============================================================
  # weknora:
  #   image: weknora/weknora:latest
  #   container_name: dobby-weknora
  #   profiles: ["weknora"]
  #   ...

  # ============================================================
  # 嵌入服务 — BGE-large-zh-v1.5
  # ============================================================
  embed:
    build:
      context: .
      dockerfile: Dockerfile.embed
    image: dobby-embed:local
    container_name: dobby-embed
    ports:
      - "9999:9999"
    restart: unless-stopped
    networks:
      - dobby-net

  # ============================================================
  # Web 聊天界面 — Gradio
  # ============================================================
  web:
    build:
      context: .
      dockerfile: Dockerfile
    image: dobby-web:local
    container_name: dobby-web
    ports:
      - "7860:7860"
    env_file:
      - .env
    environment:
      # 容器内使用服务名通信（覆盖 .env 中的 localhost）
      - DATABASE_URL=postgresql://dobby:dobby@postgres:5432/dobby_demo
      - LANGGRAPH_CHECKPOINT_DB=postgresql://dobby:dobby@postgres:5432/dobby_demo
      - EMBED_SERVER_URL=http://embed:9999/v1
      - NEO4J_URI=bolt://neo4j:7687
    depends_on:
      postgres:
        condition: service_healthy
      embed:
        condition: service_started
    restart: unless-stopped
    networks:
      - dobby-net

volumes:
  pg_data:
    driver: local
  neo4j_data:
    driver: local

networks:
  dobby-net:
    driver: bridge
    name: dobby-net
