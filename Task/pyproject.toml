[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "task-engine"
version = "0.1.0"
description = "通用任务引擎：任务流编排、多级流转与定时触发，以 MCP 形式交付"
readme = "README.md"
requires-python = ">=3.13"
license = { text = "MIT" }

# 领域层与存储层只用标准库。httpx 仅生成器与适配层需要。
dependencies = [
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
]

[project.scripts]
task-engine = "task_engine.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/task_engine"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"

[tool.ruff]
line-length = 120
target-version = "py313"